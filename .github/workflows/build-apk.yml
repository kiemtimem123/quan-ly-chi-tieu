name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: npx cap add android
      - name: Chep icon app
        continue-on-error: true
        run: |
          pip install --break-system-packages pillow || pip install pillow
          python3 - <<'PY'
          from PIL import Image
          sizes={'mdpi':48,'hdpi':72,'xhdpi':96,'xxhdpi':144,'xxxhdpi':192}
          for n,s in sizes.items():
              im=Image.open('www/icon-512.png').convert('RGBA').resize((s,s))
              for nm in ('ic_launcher','ic_launcher_round','ic_launcher_foreground'):
                  im.save('android/app/src/main/res/mipmap-'+n+'/'+nm+'.png')
          PY
          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher*.xml
      - run: npx cap sync android
      - run: cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: so-6-hu-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
