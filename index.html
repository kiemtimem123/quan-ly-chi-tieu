<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2455E6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="6 Hũ">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<title>Sổ 6 Hũ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="fonts.css">
<style>
/* Layout: mobile = một cột + thanh tab dưới; desktop = thanh bên trái + lưới 2 cột (hũ | giao dịch gần đây) */
:root{
  --bg:#F2F4F9; --surface:#FFFFFF; --surface2:#EBEFF7; --ink:#101828; --muted:#667085; --line:#E2E7F1;
  --accent:#2455E6; --accent-ink:#FFFFFF; --accent-soft:#E3EAFF; --gold:#F5B400; --gold-ink:#1B1400;
  --bad:#D92D20; --good:#12945A; --shadow:0 1px 2px rgba(16,24,40,.06),0 8px 24px rgba(16,24,40,.06);
  --jar-glass:#F4F7FD; --jar-edge:#C9D3E8; --jar-lid:#9AA8C7;
  --font:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0B1019; --surface:#151C2A; --surface2:#1E2738; --ink:#EEF2FA; --muted:#98A5BC; --line:#263148;
  --accent:#6C90FF; --accent-ink:#0B1019; --accent-soft:#1B2A57; --gold:#FFC633; --gold-ink:#1B1400;
  --bad:#FF7A70; --good:#3DD68C; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  --jar-glass:#1C2536; --jar-edge:#3A4A68; --jar-lid:#5B6B8C; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1019; --surface:#151C2A; --surface2:#1E2738; --ink:#EEF2FA; --muted:#98A5BC; --line:#263148;
  --accent:#6C90FF; --accent-ink:#0B1019; --accent-soft:#1B2A57; --gold:#FFC633; --gold-ink:#1B1400;
  --bad:#FF7A70; --good:#3DD68C; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  --jar-glass:#1C2536; --jar-edge:#3A4A68; --jar-lid:#5B6B8C; color-scheme:dark}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0;
  min-height:100vh;font-variant-numeric:tabular-nums}
[hidden]{display:none!important}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
h1,h2,h3,p{margin:0}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
.summary,.sheet,.bars,.stack,.f,.split,.list,.home-grid,.fix{grid-template-columns:minmax(0,1fr)}

.shell{display:grid;grid-template-columns:minmax(0,1fr);max-width:1180px;margin:0 auto}
main{min-width:0;padding-block:18px 150px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:22px;letter-spacing:-.02em}
.brand i{font-style:normal;font-size:24px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:5px 11px;border-radius:99px;background:var(--surface);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.warn{color:var(--gold-ink);background:var(--gold);border-color:transparent}
.monthnav{display:flex;align-items:center;gap:4px}
.monthnav button{width:34px;height:34px;border-radius:10px;background:var(--surface);border:1px solid var(--line);font-size:18px;line-height:1}
.monthnav b{min-width:112px;text-align:center;font-weight:700;font-size:14.5px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}
.summary{padding:18px;display:grid;gap:14px}
.summary .lbl{font-size:13px;color:var(--muted);font-weight:500}
.summary .big{font-size:32px;font-weight:800;letter-spacing:-.025em;line-height:1.1}
.stats3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stats3 div{background:var(--surface2);border-radius:12px;padding:10px 7px;min-width:0}
.stats3 b{display:block;font-size:clamp(10.5px,3vw,13px);font-weight:700;overflow-wrap:anywhere}
.stats3 span{font-size:12px;color:var(--muted)}
.seg{display:flex;gap:4px;height:10px}
.seg i{display:block;border-radius:99px;background:var(--surface2);overflow:hidden;position:relative}
.seg i::after{content:"";position:absolute;inset:0;width:var(--f);background:var(--c);border-radius:99px}
.hint{font-size:13px;color:var(--muted)}

.sec{display:flex;align-items:baseline;justify-content:space-between;margin:22px 2px 10px}
.sec h2{font-size:16px;font-weight:700}
.sec a,.sec button{font-size:13px;color:var(--accent);font-weight:600}

.jars{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.jar{display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px;padding:12px 6px 12px;border-radius:16px;background:var(--surface);border:1px solid var(--line);position:relative;min-width:0;transition:transform .12s}
.jar:active{transform:scale(.97)}
.jar .pc{position:absolute;top:8px;left:8px;font-size:11px;font-weight:700;padding:2px 7px;border-radius:99px;background:var(--accent-soft);color:var(--accent)}
.jw{position:relative;margin:14px 0 4px;width:58px;height:74px}
.jw svg{display:block;overflow:visible}
.jw .em{position:absolute;left:0;right:0;top:36px;text-align:center;font-size:19px;line-height:1;filter:drop-shadow(0 1px 1px rgba(0,0,0,.3));pointer-events:none}
.lq{transition:transform 1.1s cubic-bezier(.25,.8,.25,1),opacity .4s}
.wv{animation:wave 2.6s linear infinite}
@keyframes wave{from{transform:translateX(-48px)}to{transform:translateX(0)}}
.jar .nm{font-size:12.5px;font-weight:600;color:var(--muted);line-height:1.25;min-height:2.5em;display:flex;align-items:center}
.jar .bal{font-size:14px;font-weight:800;letter-spacing:-.01em;overflow-wrap:anywhere}
.jar .bal.neg{color:var(--bad)}
.jar .sp{font-size:11px;color:var(--muted);display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.sp .p{color:var(--good);font-weight:700}.sp .m{color:var(--bad);font-weight:700}
.lvl{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--muted)}.lvl .track{flex:1}

.list{display:grid}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line);min-width:0}
.row:first-child{border-top:0}
.ico{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:19px;flex:none;background:var(--accent-soft)}
.row .tx{min-width:0;flex:1}
.row .tx b{display:block;font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .tx span{font-size:12.5px;color:var(--muted)}
.amt{font-weight:700;font-size:14.5px;white-space:nowrap}
.amt.in{color:var(--good)}
.x{width:30px;height:30px;border-radius:9px;color:var(--muted);font-size:18px;flex:none}
.x:hover{background:var(--surface2);color:var(--bad)}
.day{font-size:12.5px;font-weight:700;color:var(--muted);margin:16px 4px 6px;text-transform:uppercase;letter-spacing:.04em}
.empty{padding:26px 18px;text-align:center;color:var(--muted)}
.empty h3{color:var(--ink);font-size:16px;margin-bottom:6px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;border-radius:12px;font-weight:700;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--surface2);color:var(--ink)}
.btn.danger{background:var(--bad);color:#fff}
.btn.block{width:100%}
.btns{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:14px}

.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 13px;border-radius:99px;font-size:13px;font-weight:600;background:var(--surface);border:1px solid var(--line);color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:transparent}

/* nav */
nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:space-around;background:var(--surface);border-top:1px solid var(--line);
  padding:8px max(10px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px))}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;font-weight:600;color:var(--muted);padding:6px 4px;border-radius:12px}
nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
nav button[aria-current="page"]{color:var(--accent)}
.fab{position:fixed;z-index:21;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(78px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:8px;
  background:var(--gold);color:var(--gold-ink);font-weight:800;border-radius:99px;padding:14px 20px 14px 16px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.fab b{font-size:22px;line-height:1}

/* sheet */
.ov{position:fixed;inset:0;z-index:40;background:rgba(8,12,20,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:520px;max-height:94vh;overflow:auto;background:var(--surface);border-radius:22px 22px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));display:grid;gap:14px;animation:up .2s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
.sheet h2{font-size:18px;font-weight:800}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--surface2);border-radius:12px;padding:4px;gap:4px}
.tabs button{padding:9px;border-radius:9px;font-weight:700;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.f{display:grid;gap:6px}
.f label{font-size:12.5px;font-weight:600;color:var(--muted)}
.in-t{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);outline:none}
.in-t:focus{border-color:var(--accent)}
.money{font-size:30px;font-weight:800;letter-spacing:-.02em;padding:10px 14px}
.quick{display:flex;gap:8px;flex-wrap:wrap}
.quick button{padding:6px 12px;border-radius:99px;background:var(--surface2);font-size:13px;font-weight:600}
.pick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.pick button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 4px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);font-size:12px;font-weight:600;min-width:0}
.pick button span{font-size:20px}
.pick button small{color:var(--muted);font-size:11px;font-weight:500}
.pick button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.split{background:var(--surface2);border-radius:12px;padding:10px 12px;display:grid;gap:4px;font-size:13px}
.split div{display:flex;justify-content:space-between;gap:10px}

/* stats */
.bars{display:grid;gap:14px;padding:16px}
.bar .h{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;font-weight:600;margin-bottom:6px}
.bar .h span{color:var(--muted);font-weight:500}
.track{height:10px;border-radius:99px;background:var(--surface2);overflow:hidden}
.track i{display:block;height:100%;border-radius:99px;background:var(--c)}
.cols{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;align-items:end;height:170px;padding:16px 16px 0}
.col{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;height:100%;min-width:0}
.col .pair{display:flex;align-items:flex-end;gap:4px;flex:1;width:100%;justify-content:center}
.col .pair i{display:block;width:42%;max-width:22px;border-radius:6px 6px 2px 2px;min-height:2px}
.col .pair .i1{background:var(--line)}
.col .pair .i2{background:var(--accent)}
.col span{font-size:11.5px;color:var(--muted);font-weight:600}
.chartc{padding:12px 8px 8px}.chartc svg{display:block;width:100%;height:auto}
.chartc .ttl{padding:0 8px 6px}.chartc .ttl b{display:block;font-size:15px}.chartc .ttl span{font-size:12.5px;color:var(--muted)}
.chip i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;background:var(--c)}
.chip[aria-pressed=false] i{opacity:.35}
.chip[aria-pressed=true] i{box-shadow:0 0 0 2px #fff}
.tbl{overflow-x:auto;border-radius:18px}
.tbl table{border-collapse:separate;border-spacing:0;width:100%;min-width:620px;font-size:12.5px}
.tbl th,.tbl td{padding:9px 8px;text-align:right;white-space:nowrap;border-top:1px solid var(--line)}
.tbl thead th{border-top:0;font-weight:700;color:var(--muted);font-size:12px;vertical-align:bottom}
.tbl th:first-child,.tbl td:first-child{text-align:left;position:sticky;left:0;background:var(--surface);font-weight:700;z-index:1}
.tbl tfoot td{font-weight:800;background:var(--surface2)}
.tbl tfoot td:first-child{background:var(--surface2)}
.tbl .pos{color:var(--good)}.tbl .neg{color:var(--bad)}.tbl .zero{color:var(--muted);opacity:.6}
.legend{display:flex;gap:16px;font-size:12.5px;color:var(--muted);padding:10px 16px 16px}
.legend b{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}

/* settings */
.set{padding:6px 14px}
.set .r{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.set .r:first-child{border-top:0}
.set .em{width:46px;text-align:center;padding:9px 4px}
.set .pcin{width:76px;text-align:right}
.set .nm{flex:1;min-width:0}
.tot{display:flex;justify-content:space-between;padding:12px 0;font-weight:700}
.tot.bad{color:var(--bad)}
.tog{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0}
.tog small{display:block;color:var(--muted);font-size:12.5px;font-weight:400}
.sw{width:46px;height:28px;border-radius:99px;background:var(--line);position:relative;flex:none;transition:background .15s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .15s}
.sw[aria-checked="true"]{background:var(--accent)}
.sw[aria-checked="true"]::after{transform:translateX(18px)}
.stack{display:grid;gap:10px;padding:14px}

.toast{position:fixed;z-index:60;left:50%;transform:translateX(-50%);bottom:calc(140px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:13.5px;font-weight:600;display:flex;gap:14px;align-items:center;max-width:92vw;box-shadow:var(--shadow)}
.toast button{color:var(--gold);font-weight:800}

.home-grid{display:grid;gap:0}
.view-title{font-size:20px;font-weight:800;margin-bottom:12px}

@media (min-width:900px){
  body{padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
  .shell{grid-template-columns:210px minmax(0,1fr);gap:32px}
  nav{position:sticky;top:0;align-self:start;height:100vh;flex-direction:column;justify-content:flex-start;gap:6px;background:none;border:0;padding:24px 0 0;left:auto;right:auto;bottom:auto}
  nav button{flex:none;flex-direction:row;gap:12px;font-size:14.5px;padding:11px 14px;justify-content:flex-start}
  nav button[aria-current="page"]{background:var(--accent-soft)}
  nav .logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;padding:0 14px 18px}
  main{padding-bottom:60px}
  .fab{bottom:28px;right:32px}
  .toast{bottom:90px}
  .home-grid{grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:28px;align-items:start}
  .ov{align-items:center}
  .sheet{border-radius:22px}
  .brand{display:none}
  .jar .bal{font-size:15px}
}
@media (min-width:900px){nav .logo{display:flex}}
nav .logo{display:none}
@media (min-width:900px){.stats3 b{font-size:15px}.stats3 div{padding:10px 12px}}
@media (max-width:359px){.stats3 b{font-size:12px}.jar .bal{font-size:12.5px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="shell">
  <nav id="nav" aria-label="Điều hướng"></nav>
  <main id="app"></main>
</div>
<button class="fab" id="fab" data-a="add" aria-label="Ghi giao dịch"><b>+</b><span>Ghi chép</span></button>
<div id="sheetRoot"></div>
<div id="toastRoot"></div>
<input type="file" id="file" accept="application/json" hidden>

<script>
(function(){
'use strict';
var KEY='hu6.v1';
var PRESET=[
 {id:'thiet-yeu',name:'Thiết yếu',icon:'🏠',pct:55,color:'#2455E6'},
 {id:'tu-do',name:'Tự do tài chính',icon:'📈',pct:10,color:'#0E9F8E'},
 {id:'giao-duc',name:'Giáo dục',icon:'📚',pct:10,color:'#7A4DE8'},
 {id:'tiet-kiem',name:'Tiết kiệm',icon:'💰',pct:10,color:'#E89B0C'},
 {id:'huong-thu',name:'Hưởng thụ',icon:'🎉',pct:10,color:'#E5487F'},
 {id:'cho-di',name:'Cho đi',icon:'🎁',pct:5,color:'#3BA55D'}
];
var mem=null;
function clone(o){return JSON.parse(JSON.stringify(o))}
function load(){
  try{var s=localStorage.getItem(KEY);if(s){var d=JSON.parse(s);if(d&&d.jars&&d.tx)return d}}catch(e){}
  return mem?clone(mem):{v:1,jars:clone(PRESET),tx:[],carry:true};
}
var S=load();
function save(){mem=clone(S);try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

var ui={rng:'6m',gj:'tiet-kiem',hid:{},sumMode:'month',sumYear:null,sumMetric:'net',prev:{},view:'home',month:null,filter:'all',sheet:null,del:null,resetStep:0,installEvt:null};
function pad(n){return n<10?'0'+n:''+n}
function today(){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function mk(date){return date.slice(0,7)}
ui.month=mk(today());
function shift(m,k){var y=+m.slice(0,4),mo=+m.slice(5,7)-1+k;y+=Math.floor(mo/12);mo=((mo%12)+12)%12;return y+'-'+pad(mo+1)}
function mlabel(m){return 'Tháng '+(+m.slice(5,7))+'/'+m.slice(0,4)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]})}
function fmt(n){return new Intl.NumberFormat('vi-VN').format(Math.round(n))+'đ'}
function short(n){var a=Math.abs(n);if(a>=1e6)return (n/1e6).toFixed(a>=1e7?0:1).replace('.0','').replace('.',',')+'tr';if(a>=1e3)return Math.round(n/1e3)+'k';return ''+Math.round(n)}
function jar(id){for(var i=0;i<S.jars.length;i++)if(S.jars[i].id===id)return S.jars[i];return {id:id,name:'Khác',icon:'•',color:'#888',pct:0}}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function daysIn(m){return new Date(+m.slice(0,4),+m.slice(5,7),0).getDate()}

function split(amount){
  var P=0,i;for(i=0;i<S.jars.length;i++)P+=Math.max(0,+S.jars[i].pct||0);
  var out={},used=0,big=null;
  for(i=0;i<S.jars.length;i++){
    var j=S.jars[i],p=P>0?Math.max(0,+j.pct||0)/P:1/S.jars.length;
    var v=Math.floor(amount*p);out[j.id]=v;used+=v;
    if(!big||p>big.p)big={id:j.id,p:p};
  }
  if(big)out[big.id]+=amount-used;
  return out;
}

function jarStats(m){
  var res={};
  S.jars.forEach(function(j){res[j.id]={opening:0,inc:0,spent:0,tin:0,tout:0}});
  S.tx.forEach(function(t){
    var tm=mk(t.date),cur=tm===m,before=tm<m&&S.carry;
    if(!cur&&!before)return;
    if(t.type==='income'){
      Object.keys(t.split||{}).forEach(function(id){
        if(!res[id])return;
        if(cur)res[id].inc+=t.split[id];else res[id].opening+=t.split[id];
      });
    }else if(t.type==='transfer'){
      if(res[t.to]){if(cur)res[t.to].tin+=t.amount;else res[t.to].opening+=t.amount}
      if(res[t.from]){if(cur)res[t.from].tout+=t.amount;else res[t.from].opening-=t.amount}
    }else if(res[t.jar]){
      if(cur)res[t.jar].spent+=t.amount;else res[t.jar].opening-=t.amount;
    }
  });
  var tot={inc:0,spent:0,bal:0,avail:0};
  Object.keys(res).forEach(function(id){
    var r=res[id];r.avail=r.opening+r.inc+r.tin-r.tout;r.bal=r.avail-r.spent;
    tot.inc+=r.inc;tot.spent+=r.spent;tot.bal+=r.bal;tot.avail+=Math.max(0,r.avail);
  });
  return {j:res,t:tot};
}
function monthIncome(m){var s=0;S.tx.forEach(function(t){if(t.type==='income'&&mk(t.date)===m)s+=t.amount});return s}
function monthTx(m){return S.tx.filter(function(t){return mk(t.date)===m}).sort(function(a,b){return a.date<b.date?1:a.date>b.date?-1:(a.id<b.id?1:-1)})}

function refIncome(){
  if(S.ref>0)return S.ref;
  var by={},mx=0;
  S.tx.forEach(function(t){if(t.type==='income'&&!t.target){var m=mk(t.date);by[m]=(by[m]||0)+t.amount}});
  for(var k in by)mx=Math.max(mx,by[k]);
  return mx||1;
}
function jarLevel(j,bal){
  var P=0;S.jars.forEach(function(x){P+=Math.max(0,+x.pct||0)});
  var cap=refIncome()*(P>0?Math.max(0,+j.pct||0)/P:1/S.jars.length);
  if(cap<=0)return bal>0?1:0;
  return Math.max(0,Math.min(1,bal/cap));
}

function nice(lo,hi){
  if(hi<=lo)hi=lo+1;
  var raw=(hi-lo)/4,mag=Math.pow(10,Math.floor(Math.log(raw)/Math.LN10)),r=raw/mag;
  var step=(r<=1?1:r<=2?2:r<=2.5?2.5:r<=5?5:10)*mag;
  var a=Math.floor(lo/step+1e-9)*step,b=Math.ceil(hi/step-1e-9)*step,t=[];
  for(var v=a;v<=b+step/2;v+=step)t.push(Math.round(v*100)/100);
  return {lo:a,hi:b,ticks:t};
}

    o+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(v)+'" y2="'+Y(v)+'" stroke="var(--line)" stroke-width="'+(v===0?1.4:1)+'"/><text x="'+(L-6)+'" y="'+(Y(v)+3.5)+'" text-anchor="end" font-size="10" fill="var(--muted)">'+short(v)+'</text>';
  });

  series.forEach(function(se){

  var gchips='<div class="chips">'+S.jars.map(function(j){return '<button class="chip" data-a="gj" data-jar="'+j.id+'" aria-pressed="'+(ui.gj===j.id)+'" style="--c:'+j.color+'"><i></i>'+esc(j.name)+'</button>'}).join('')+'</div>';
  var B='<div class="card chartc"><div class="ttl"><b>Tăng trưởng hũ '+esc(g.name)+'</b><span>Nét đậm: số dư · nét đứt: tổng tiền vào dồn · '+span+'</span></div>'+
   (sumI+sumO>0||end!==0?lineChart(labels,[{name:'Tổng tiền vào',color:'var(--muted)',vals:cin,dash:1},{name:'Số dư '+g.name,color:g.color,vals:bal,area:1}],'Biểu đồ tăng trưởng hũ '+g.name):'<p class="hint" style="padding:30px 10px;text-align:center">Hũ này chưa có phát sinh trong khoảng thời gian này.</p>')+
   '<div class="stats3" style="padding:10px 8px 4px"><div><span>Số dư cuối kỳ</span><b>'+fmt(end)+'</b></div><div><span>Tăng trong kỳ</span><b style="color:'+(gr>=0?'var(--good)':'var(--bad)')+'">'+(gr>=0?'+':'−')+fmt(Math.abs(gr))+(open>0?' ('+(gr>=0?'+':'−')+Math.abs(Math.round(gr/open*100))+'%)':'')+'</b></div><div><span>Vào / Ra</span><b>+'+short(sumI)+' / −'+short(sumO)+'</b></div></div></div>';
  return '<div class="sec"><h2>Biểu đồ đường</h2></div>'+chips+A+'<div class="sec" style="margin-top:16px"><h2>Tăng trưởng từng hũ</h2></div>'+gchips+B;
}
function sumSection(){
  var a=aggAll(),yrs=[],cy=+today().slice(0,4),y0=cy,y1=cy,k;
  for(k in a){var y=+k.slice(0,4);if(y<y0)y0=y;if(y>y1)y1=y}
  if(!ui.sumYear)ui.sumYear=cy;
  var mt=ui.sumMetric,mode=ui.sumMode,rows=[],periods=[];
  if(mode==='month'){for(var m=1;m<=12;m++)periods.push({k:ui.sumYear+'-'+pad(m),l:'Tháng '+m})}
  else{for(var y=y0;y<=y1;y++)periods.push({k:''+y,l:'Năm '+y})}
  function cell(v){return '<td class="'+(mt==='net'||mt==='bal'?(v>0?'pos':v<0?'neg':'zero'):(v===0?'zero':''))+'">'+(v===0?'–':new Intl.NumberFormat('vi-VN').format(Math.round(v)))+'</td>'}
  var head='<th></th>'+S.jars.map(function(j){return '<th>'+esc(j.icon)+'<br>'+esc(j.name)+'</th>'}).join('')+'<th>Tổng</th>';
  var body=periods.map(function(p){
    var tot=0;
    var tds=S.jars.map(function(j){var v=pval(a,p.k,j.id,mt);tot+=v;return cell(v)}).join('');
    return '<tr><td>'+p.l+'</td>'+tds+cell(tot).replace('<td','<td style="font-weight:800"')+'</tr>';
  }).join('');
  var foot='';
  if(mt!=='bal'){
    var gt=0,tds=S.jars.map(function(j){var v=0;periods.forEach(function(p){v+=pval(a,p.k,j.id,mt)});gt+=v;return '<td>'+(v===0?'–':new Intl.NumberFormat('vi-VN').format(Math.round(v)))+'</td>'}).join('');
    foot='<tfoot><tr><td>'+(mode==='month'?'Cả năm '+ui.sumYear:'Tất cả')+'</td>'+tds+'<td>'+new Intl.NumberFormat('vi-VN').format(Math.round(gt))+'</td></tr></tfoot>';
  }
  var metrics=[['net','Còn lại (nạp − chi)'],['in','Đã nạp'],['out','Đã chi'],['bal','Số dư lũy kế']];
  var sub={net:'Tiết kiệm được trong từng kỳ = tiền nạp trừ tiền chi, đã tính cả chuyển hũ.',in:'Tổng tiền đã nạp vào từng hũ (không tính chuyển hũ).',out:'Tổng tiền đã chi từ từng hũ (không tính chuyển hũ).',bal:'Số dư của hũ tính dồn từ đầu đến hết kỳ đó.'}[mt];
  return '<div class="sec"><h2>Tổng kết từng hũ</h2></div>'+
   '<div class="tabs" style="margin-bottom:10px"><button data-a="sm" data-m="month" aria-selected="'+(mode==='month')+'">Theo tháng</button><button data-a="sm" data-m="year" aria-selected="'+(mode==='year')+'">Theo năm</button></div>'+
   (mode==='month'?'<div class="monthnav" style="justify-content:center;margin-bottom:8px"><button data-a="sy" data-d="-1" aria-label="Năm trước">‹</button><b>Năm '+ui.sumYear+'</b><button data-a="sy" data-d="1" aria-label="Năm sau">›</button></div>':'')+
   '<div class="chips">'+metrics.map(function(x){return '<button class="chip" data-a="sx" data-x="'+x[0]+'" aria-pressed="'+(mt===x[0])+'">'+x[1]+'</button>'}).join('')+'</div>'+
   '<div class="card tbl"><table><thead><tr>'+head+'</tr></thead><tbody>'+body+'</tbody>'+foot+'</table></div><p class="hint" style="margin:8px 4px 0">'+sub+' Đơn vị: đồng. Vuốt ngang để xem đủ cột.</p>';
}
function viewStat(){

   '<div class="sec"><h2>6 tháng gần nhất</h2></div><div class="card">'+cols+'</div>';

function closeSheet(){ui.sheet=null;document.getElementById('sheetRoot').innerHTML=''}
function submitSheet(){
  var s=ui.sheet,a=parseAmt(document.getElementById('amt').value),note=document.getElementById('note').value.trim(),date=document.getElementById('date').value||today();
  if(!a){document.getElementById('amt').focus();toast('Nhập số tiền trước khi lưu');return}
  if(s.type==='transfer'){
    if(s.from===s.to){toast('Chọn hai hũ khác nhau');return}
    var fb=jarStats(mk(date)).j[s.from].bal;
    if(a>fb){toast('Hũ '+jar(s.from).name+' chỉ còn '+fmt(Math.max(0,fb)));return}
    S.tx.push({id:uid(),type:'transfer',from:s.from,to:s.to,amount:a,note:note,date:date});save();
    ui.month=mk(date);closeSheet();render();toast('Đã chuyển '+fmt(a)+' từ '+jar(s.from).name+' sang '+jar(s.to).name+'.');return;
  }
  var t={id:uid(),type:s.type,amount:a,note:note,date:date};
  if(s.type==='income'){if(s.target==='auto')t.split=split(a);else{t.split={};t.split[s.target]=a;t.target=s.target}}else t.jar=s.jar;
  S.tx.push(t);save();
  var over='';
  if(s.type==='expense'){var b=jarStats(mk(date)).j[s.jar].bal;if(b<0)over=' Hũ '+jar(s.jar).name+' đã vượt '+fmt(-b)+'.'}
  ui.month=mk(date);closeSheet();render();toast((s.type==='income'?(s.target==='auto'?'Đã chia '+fmt(a)+' vào '+S.jars.length+' hũ.':'Đã nạp '+fmt(a)+' vào hũ '+jar(s.target).name+'.'):'Đã trừ '+fmt(a)+' khỏi hũ '+jar(s.jar).name+'.')+over);
}

/* ---------- toast ---------- */
var tt=null;
function toast(msg,undo){
  var r=document.getElementById('toastRoot');
  r.innerHTML='<div class="toast" role="status"><span>'+esc(msg)+'</span>'+(undo?'<button data-a="undo">Hoàn tác</button>':'')+'</div>';
  clearTimeout(tt);tt=setTimeout(function(){r.innerHTML=''},undo?5000:3200);
}

/* ---------- demo ---------- */
function demo(){
  var t=today(),cur=mk(t),dn=+t.slice(8),tx=[];
  var plan=[
   ['thiet-yeu','Tiền nhà',3500000,1],['thiet-yeu','Tiền điện nước',620000,5],['thiet-yeu','Đi chợ',480000,3],['thiet-yeu','Xăng xe',150000,9],['thiet-yeu','Siêu thị',720000,12],
   ['giao-duc','Khóa học online',800000,6],['huong-thu','Cà phê với bạn',85000,4],['huong-thu','Xem phim',180000,10],['huong-thu','Đi chơi',500000,2],
   ['cho-di','Mừng cưới',500000,8],['tiet-kiem','Gửi tiết kiệm',600000,7],['tu-do','Mua chứng chỉ quỹ',1000000,7]
  ];
  for(var k=2;k>=0;k--){
    var m=shift(cur,-k),lim=k===0?dn:daysIn(m);
    var inc=15000000;
    tx.push({id:uid(),type:'income',amount:inc,note:'Lương '+mlabel(m).toLowerCase(),date:m+'-01',split:split(inc)});
    plan.forEach(function(p,i){
      var d=Math.min(p[3]+(k?k:0),lim);if(d<1||(k===0&&p[3]>dn))return;
      var f=1+((i*7+k*3)%5-2)*0.06;
      tx.push({id:uid(),type:'expense',jar:p[0],amount:Math.round(p[2]*f/1000)*1000,note:p[1],date:m+'-'+pad(d)});
    });
  }
  S.tx=tx;save();render();toast('Đã nạp dữ liệu mẫu. Xóa trong Cài đặt khi muốn dùng thật.');
}

/* ---------- events ---------- */
var lastDel=null;
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-a]');if(!el)return;
  var a=el.dataset.a;
  if(a==='closebg'){if(e.target===el)closeSheet();return}
  if(a==='nav'){ui.view=el.dataset.v;ui.resetStep=0;render();window.scrollTo(0,0)}
  else if(a==='mon'){ui.month=shift(ui.month,+el.dataset.d);render()}
  else if(a==='add'){openSheet({jar:el.dataset.jar,type:el.dataset.type})}
  else if(a==='jar'){openJar(el.dataset.jar)}
  else if(a==='spend'){openSheet({jar:el.dataset.jar,type:'expense'})}
  else if(a==='topup'){openSheet({jar:el.dataset.jar,type:'income',target:el.dataset.jar})}
  else if(a==='pt'){ui.sheet.target=el.dataset.t;[].forEach.call(document.querySelectorAll('[data-a=pt]'),function(b){b.setAttribute('aria-pressed',b.dataset.t===ui.sheet.target)});updSplit()}
  else if(a==='close'){closeSheet()}
  else if(a==='stype'){ui.sheet.type=el.dataset.t;redrawSheet();document.getElementById('amt').focus()}
  else if(a==='pf'){var o1=ui.sheet.from;ui.sheet.from=el.dataset.jar;if(ui.sheet.to===el.dataset.jar)ui.sheet.to=o1;redrawSheet()}
  else if(a==='pto'){var o2=ui.sheet.to;ui.sheet.to=el.dataset.jar;if(ui.sheet.from===el.dataset.jar)ui.sheet.from=o2;redrawSheet()}
  else if(a==='qall'){var dv=document.getElementById('date').value||today(),bb=jarStats(mk(dv)).j[ui.sheet.from].bal;var ia=document.getElementById('amt');ia.value=fmtIn(Math.max(0,Math.floor(bb)))}
  else if(a==='xfer'){openSheet({type:'transfer',from:el.dataset.jar})}
  else if(a==='pj'){ui.sheet.jar=el.dataset.jar;[].forEach.call(document.querySelectorAll('.pick button'),function(b){b.setAttribute('aria-pressed',b.dataset.jar===ui.sheet.jar)})}
  else if(a==='q'){var i=document.getElementById('amt');i.value=fmtIn(parseAmt(i.value)+(+el.dataset.n));updSplit()}
  else if(a==='del'){
    var idx=S.tx.findIndex(function(t){return t.id===el.dataset.id});
    if(idx>-1){lastDel=S.tx.splice(idx,1)[0];save();render();toast('Đã xóa giao dịch',true)}
  }
  else if(a==='undo'){if(lastDel){S.tx.push(lastDel);lastDel=null;save();render();document.getElementById('toastRoot').innerHTML=''}}
  else if(a==='rg'){ui.rng=el.dataset.r;render()}
  else if(a==='hj'){ui.hid[el.dataset.jar]=!ui.hid[el.dataset.jar];render()}
  else if(a==='gj'){ui.gj=el.dataset.jar;render()}
  else if(a==='sm'){ui.sumMode=el.dataset.m;render()}
  else if(a==='sy'){ui.sumYear=(ui.sumYear||+today().slice(0,4))+(+el.dataset.d);render()}
  else if(a==='sx'){ui.sumMetric=el.dataset.x;render()}
  else if(a==='flt'){ui.filter=el.dataset.f;render()}
  else if(a==='demo'){demo()}
  else if(a==='preset'){S.jars=clone(PRESET);save();render();toast('Đã về tỷ lệ 6 hũ chuẩn')}
  else if(a==='carry'){S.carry=!S.carry;save();render()}
  else if(a==='export'){
    try{var b=new Blob([JSON.stringify(S,null,2)],{type:'application/json'}),u=URL.createObjectURL(b),l=document.createElement('a');
      l.href=u;l.download='so-6-hu-'+today()+'.json';document.body.appendChild(l);l.click();l.remove();setTimeout(function(){URL.revokeObjectURL(u)},1000);toast('Đã xuất bản sao lưu')}catch(x){toast('Không tải được, hãy dùng “Sao chép dữ liệu”')}
  }
  else if(a==='copy'){
    var txt=JSON.stringify(S);
    (navigator.clipboard&&navigator.clipboard.writeText?navigator.clipboard.writeText(txt):Promise.reject()).then(function(){toast('Đã sao chép dữ liệu')},function(){toast('Trình duyệt không cho sao chép. Hãy dùng nút xuất .json')});
  }
  else if(a==='import'){document.getElementById('file').click()}
  else if(a==='reset'){
    if(!ui.resetStep){ui.resetStep=1;render()}
    else{S={v:1,jars:clone(PRESET),tx:[],carry:true};ui.resetStep=0;save();render();toast('Đã xóa toàn bộ dữ liệu')}
  }
  else if(a==='install'){if(ui.installEvt){ui.installEvt.prompt();ui.installEvt=null}}
});
document.addEventListener('input',function(e){
  var t=e.target;
  if(t.id==='amt'){var c=t.value.length-t.selectionStart;t.value=fmtIn(parseAmt(t.value));try{var p=t.value.length-c;t.setSelectionRange(p,p)}catch(x){}updSplit();return}
  if(t.id==='ref'){var n=parseAmt(t.value);t.value=fmtIn(n);S.ref=n||0;save();return}
  if(t.dataset&&t.dataset.k){
    var j=S.jars[+t.dataset.i],k=t.dataset.k;
    j[k]=k==='pct'?Math.max(0,Math.min(100,+t.value||0)):t.value;
    save();
    if(k==='pct'){var P=0;S.jars.forEach(function(x){P+=+x.pct||0});var tot=document.getElementById('tot');tot.className='tot'+(P!==100?' bad':'');tot.lastChild.textContent=P+'%'+(P!==100?' (cần 100%)':'')}
  }
});
document.addEventListener('submit',function(e){if(e.target.id==='form'){e.preventDefault();submitSheet()}});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&ui.sheet)closeSheet()});
document.getElementById('file').addEventListener('change',function(e){
  var f=e.target.files[0];if(!f)return;var r=new FileReader();
  r.onload=function(){try{var d=JSON.parse(r.result);if(!d.jars||!d.tx)throw 0;S=d;if(typeof S.carry!=='boolean')S.carry=true;save();render();toast('Đã nhập '+S.tx.length+' giao dịch')}catch(x){toast('File không đúng định dạng sao lưu')}};
  r.readAsText(f);e.target.value='';
});
window.addEventListener('online',render);window.addEventListener('offline',render);
window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();ui.installEvt=e;if(ui.view==='set')render()});
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){
  try{navigator.serviceWorker.register('sw.js').catch(function(){})}catch(e){}
}
render();
window.__hu6={S:function(){return S},demo:demo};
})();
</script>
